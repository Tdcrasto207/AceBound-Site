# Netlify build settings for a plain static HTML site.
# No build step: the repository root is published as-is.
[build]
  publish = "."
  command = ""

# Clean URLs
[[redirects]]
  from = "/niches"
  to = "/niches.html"
  status = 200

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200
