# Netlify build settings for a plain static HTML site.
# No build step: the repository root is published as-is.
[build]
  publish = "."
  command = ""

# Clean URL for the niches page
[[redirects]]
  from = "/niches"
  to = "/niches.html"
  status = 200

# Internal scripts live in /tools; don't serve them on the website
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true
